<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malik Lawson's Mighty Lion || ITIS3135 || Survey</title>
    <link rel="stylesheet" href="styles/default.css">
    <link rel="icon" type="image/jpeg" href="images/vecteezy_lion-logo.jpg"/>
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
</head>
<body>
    <div data-include="components/header.html"></div>
    <script src="scripts/include.min.js"></script>

    <hr> 
    <main>
        <h2>Survey</h2>
        <h3>Mighty Lion Hypercar Specification Survey</h3>
        <p>Please take time to complete this consultation survey form to help us personalize your Bugatti hypercar engineering request and profile.</p>

        <!-- id="survey-form" identifies the survey form -->
        <form id="survey-form">
            <!-- div class="form-group" identifies each group of the survey form -->
            <div class="form-group">
                <label for="name"><strong>Full name</strong></label>
                <input id="name" name="name" type="text" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="number"><strong>Age</strong></label>
                <input id="number" name="age" type="number" min="18" max="100" placeholder="Enter your age" required>
            </div>

            <div class="form-group">
                <label for="email"><strong>Email Address</strong></label>
                <input id="email" name="email" type="text" placeholder="email@address.com" required>
            </div>

            <div class="form-group">
                <label for="horsepower"><strong>Desired Target Horsepower (1,000- 2,000 HP)</strong></label>
                <input id="horsepower" name="horsepower" type="number" min="1000" max="2000" placeholder="Enter your desired horsepower" required>
            </div>

            <div class="form-group">
                <label><strong>Primary Vehicle Interest</strong></label>
                <select>
                    <option>Select a Bugatti Hypercar Model</option>
                    <option>Bugatti Tourbillion (V16 Hybrid)</option>
                    <option>Bugatti Bolide (Track Spec)</option>
                    <option>Bugatti Chiron Super Sport</option>
                    <option>Bugatti W16 Mistrail</option>
                    <option>Bugatti Divo</option>
                    <option>Bugatti Centodieci</option>
                </select>
            </div>

            <div class="form-group">
                <label><strong>Vehicle Exterior Color</strong></label>
                <input id="vehicle-color" name="vehicle-color" type="text" placeholder="Enter vehicle exterior color" required>
            </div>

            <p>
                <label for="comments"><strong>Additional comments</strong></label>
                <textarea id="comments" name="comments" rows="5" cols="40" placeholder="Share any additional comments"></textarea>
            </p>

            <button id="submit" type="submit">Submit</button>
        </form>
    </main>

    <hr>
    <div data-include="components/footer.html"></div>
    <script src="scripts/include.min.js"></script>

    <script src="https://divonbriesen.github.io/teaching/tools/standards-check.js" defer></script>
</body>
</html>
