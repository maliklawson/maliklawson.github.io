<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malik Lawson's Mighty Lion || ITIS3135 || Introduction Form</title>
    <link rel="stylesheet" href="styles/default.css">
    <link rel="icon" type="image/jpeg" href="images/vecteezy_lion-logo.jpg"/>
    <script src="https://divonbriesen.github.io/teaching/tools/standards-check.js" defer></script>
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
</head>
<body>
    <!-- Header -->
    <div data-include="components/header.html"></div>
    <script src="scripts/include.min.js"></script>
    <hr>

    <main>
        <h2>Introduction Form</h2>
        <h3>Please Submit The Form Below.</h3>
        <form id="intro-form">
            <fieldset>
                <legend><strong>Personal Information</strong></legend>

                <label for="first-name">First Name:</label>
                <input type="text" id="first-name" name="first-name" value="Malik" placeholder="Enter your first name" required>

                <label for="middle-name">Middle Name (or initial) (optional):</label>
                <input type="text" id="middle-name" name="middle-name" placeholder="Enter your middle name">

                <label for="nickname">Nickname/Preferred Name (optional):</label>
                <input type="text" id="nickname" name="nickname" placeholder="Enter Nickname/Preferred Name">

                <label for="last-name">Last Name:</label>
                <input type="text" id="last-name" name="last-name" value="Lawson" placeholder="Enter your last name" required>
            </fieldset>

            <fieldset>
                <legend><strong>Public Acknowledgement</strong></legend>

                <label for="acknowledgment">Acknowledgment Statement:</label>
                <input type="text" id="acknowledgment" name="acknowledgment" value="I acknowledge that this is a public document" placeholder="This is a public document acknowledgement" required>

                <label for="acknowledgment-date">Acknowledgement Date (MM/DD/YYYY):</label>
                <input type="number" id="acknowledgment-date" name="acknowledgment-date" value="11/06/2026" placeholder="MM/DD/YYYY" required>
            </fieldset>

            <fieldset>
                <legend><strong>Mascot Information</strong></legend>

                <label for="mascot-adj">Mascot Adjective:</label>
                <input type="text" id="mascot-adj" name="mascot-adj" value="Mighty" placeholder="Enter your mascot adjective" required>

                <label for="mascot-animal">Mascot Animal:</label>
                <input type="text" id="mascot-animal" name="mascot-animal" value="Lion" placeholder="Enter your mascot name" required>

                <label for="divider">Divider Symbol (ie, ~, | , ♥️, etc):</label>
                <input type="text" id="divider" name="divider" value="|" placeholder="Enter your divider symbol" required>
            </fieldset>

            <fieldset>
                <legend><strong>Picture Information</strong></legend>

                <label>Picture:</label>

                <label>Picture Caption:</label>
            </fieldset>

            <fieldset>
                <legend><strong>Personal Statement Information</strong></legend>

                <label>Personal Statement:</label>
            </fieldset>

            <fieldset>
                <legend><strong>Background Information</strong></legend>

                <label>Personal Background:</label>

                <label>Professional Background:</label>

                <label>Academic Background:</label>
            </fieldset>

            <fieldset>
                <legend><strong>Computer Information & Work Location</strong></legend>

                <label>Primary Work Computer (type, OS, and version):</label>

                <label>Primary Work Location:</label>

                <label>Alternate Computer & Location:</label>
            </fieldset>

            <fieldset>
                <legend><strong>Courses I'm Taking, & Why</strong></legend>

            </fieldset>

            <fieldset>
                <legend><strong>Favorite Quote</strong></legend>

                <label>Quote:</label>

                <label>Author of Quote:</label>
            </fieldset>

            <fieldset>
                <legend><strong>Optional Inputs</strong></legend>

                <label>Funny/Interesting Item to Remember Me by:</label>

                <label>I'd Also Like to Share:</label>
            </fieldset>

            <fieldset>
                <legend><strong>Personal Links</strong></legend>

                <label>CLT Web:</label>

                <label>GitHub.io:</label>

                <label>GitHub:</label>

                <label>freeCodeCamp:</label>

                <label>Codecademy:</label>

                <label>LinkedIn:</label>
            </fieldset>
        </form>
    </main>

    <hr>
    <!-- Footer -->
    <div data-include="components/footer.html"></div>
    <script src="scripts/include.min.js"></script>
</body>
</html>
